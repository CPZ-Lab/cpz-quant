site_name: cpz-quant
site_description: >-
  Open-source quantitative portfolio optimization, risk analytics, and
  anti-overfitting strategy certification in Python, from CPZ Lab.
site_url: https://cpz-lab.github.io/cpz-quant/
repo_url: https://github.com/CPZ-Lab/cpz-quant
repo_name: CPZ-Lab/cpz-quant
copyright: Copyright &copy; 2024-2026 CPZ Capital Ltd. Apache-2.0.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Portfolio optimization: portfolio.md
  - Convex backend: convex.md
  - Model selection: model-selection.md
  - Certification: certification.md
  - Indicators: indicators.md
